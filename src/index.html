<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Cross-Platform Calculator - Apple HIG design with light and dark mode">
    <title>Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Telemetry Header -->
        <header class="telemetry-header" role="banner">
            <div class="brand-section">
                <span class="brand-badge">CALCULATOR</span>
                <span class="brand-title">Apple HIG Studio</span>
            </div>
            <div class="telemetry-stats">
                <div class="stat-item">
                    <span class="led-indicator"></span>
                    <span>ONLINE</span>
                </div>
            </div>
        </header>

        <!-- Main Calculator Viewport -->
        <main class="main-viewport" role="main">
            <section class="calculator-window" aria-label="Apple Calculator">
                <div class="window-titlebar">
                    <div class="window-controls">
                        <button class="traffic-light traffic-close" title="Reset Calculator" id="btn-win-reset" aria-label="Close and reset"></button>
                        <button class="traffic-light traffic-min" title="Minimize" aria-label="Minimize"></button>
                        <button class="traffic-light traffic-max" title="Zoom" aria-label="Zoom"></button>
                    </div>
                    <span class="window-title">Calculator</span>
                    <div style="width: 52px;"></div>
                </div>

                <!-- Display Unit -->
                <div class="display-unit" aria-live="polite">
                    <div class="annunciator-bar">
                        <span class="annunciator-item" id="ann-mem"></span>
                    </div>
                    <div class="secondary-display" id="sub-display">&nbsp;</div>
                    <div class="primary-display" id="main-display">0</div>
                </div>

                <!-- Keypad Surface -->
                <div class="keypad-container">
                    <div class="key-grid" role="group" aria-label="Calculator keypad">
                        <button class="key key-action" data-action="C" aria-label="Clear all">C</button>
                        <button class="key key-action" data-action="+/-" aria-label="Toggle sign">&plusmn;</button>
                        <button class="key key-action" data-action="Bk" aria-label="Delete last digit">&al;</button>
                        <button class="key key-op" data-action="/" aria-label="Divide">&divide;</button>

                        <button class="key" data-digit="7">7</button>
                        <button class="key" data-digit="8">8</button>
                        <button class="key" data-digit="9">9</button>
                        <button class="key key-op" data-action="*" aria-label="Multiply">&times;</button>

                        <button class="key" data-digit="4">4</button>
                        <button class="key" data-digit="5">5</button>
                        <button class="key" data-digit="6">6</button>
                        <button class="key key-op" data-action="-" aria-label="Subtract">&minus;</button>

                        <button class="key" data-digit="1">1</button>
                        <button class="key" data-digit="2">2</button>
                        <button class="key" data-digit="3">3</button>
                        <button class="key key-op" data-action="+" aria-label="Add">&plus;</button>

                        <button class="key key-zero" data-digit="0">0</button>
                        <button class="key" data-action=".">.</button>
                        <button class="key key-equals" data-action="=" aria-label="Equals">=</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer-bar" role="contentinfo">
            <div>Apple Human Interface Guidelines &middot; Calculator</div>
            <div class="footer-links">
                <a class="footer-link" href="https://github.com/spdedsec/shae-dart-cross-platform-calculator" target="_blank" rel="noopener">GitHub</a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
