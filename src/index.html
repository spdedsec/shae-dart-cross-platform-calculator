<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAE — Dart Calculator</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- Telemetry Header -->
        <header class="telemetry-header">
            <div class="brand-section">
                <span class="brand-badge">SHAE</span>
                <span class="brand-title">Dart Calculator</span>
            </div>
            <div class="telemetry-stats">
                <div class="stat-item">
                    <span class="led-indicator"></span>
                    <span>RUNTIME: WEB / DESKTOP</span>
                </div>
                <div class="stat-item">
                    <span class="led-indicator led-oxide"></span>
                    <span>ARCH: 0px RADIUS / 1px BORDERS</span>
                </div>
            </div>
        </header>

        <!-- Main Calculator Viewport -->
        <main class="main-viewport">
            <section class="calculator-window" aria-label="Calculator Device">
                <div class="window-titlebar">
                    <span class="window-title">SYS://SHAE.DART.CALC</span>
                    <div class="window-controls">
                        <button class="window-ctrl-btn" title="Inspect Object">?</button>
                        <button class="window-ctrl-btn" title="Minimize">_</button>
                        <button class="window-ctrl-btn" title="Maximize">□</button>
                        <button class="window-ctrl-btn" title="Reset" id="btn-win-reset">✕</button>
                    </div>
                </div>

                <!-- Display Unit -->
                <div class="display-unit">
                    <div class="annunciator-bar">
                        <span class="annunciator-item" id="ann-mem">MEM: OFF</span>
                    </div>
                    <div class="secondary-display" id="sub-display">&nbsp;</div>
                    <div class="primary-display" id="main-display">0</div>
                </div>

                <!-- Keypad Surface -->
                <div class="keypad-container">
                    <div class="key-grid grid-main">
                        <button class="key key-action" data-action="C">C</button>
                        <button class="key key-action" data-action="Bk">⌫</button>
                        <button class="key key-op" data-action="/">÷</button>
                        <button class="key key-equals" data-action="=">=</button>

                        <button class="key" data-digit="7">7</button>
                        <button class="key" data-digit="8">8</button>
                        <button class="key" data-digit="9">9</button>
                        <button class="key key-op" data-action="*">×</button>

                        <button class="key" data-digit="4">4</button>
                        <button class="key" data-digit="5">5</button>
                        <button class="key" data-digit="6">6</button>
                        <button class="key key-op" data-action="−">−</button>

                        <button class="key" data-digit="1">1</button>
                        <button class="key" data-digit="2">2</button>
                        <button class="key" data-digit="3">3</button>
                        <button class="key key-op" data-action="+">+</button>

                        <button class="key" data-action="+/-">±</button>
                        <button class="key key-zero" data-digit="0">0</button>
                        <button class="key" data-action=".">.</button>
                        <button class="key" data-action="=">=</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer Telemetry -->
        <footer class="footer-bar">
            <div>SHAE Dart Architecture :: Release v0.1.0 :: MIT License</div>
            <div class="footer-links">
                <a class="footer-link" href="https://github.com/spdedsec/shae-dart-cross-platform-calculator" target="_blank" rel="noopener">GitHub Repository</a>
                <a class="footer-link" href="https://github.com/spdedsec/shae-dart-cross-platform-calculator/blob/main/README.md" target="_blank" rel="noopener">Documentation</a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
